<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ImesgU</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1 class=" loginpage">ImesgU</h1>
        <div class="login-box">
            <h2>Login</h2>
            <input
                class="inputs space-input"
                type="text"
                id="username"
                placeholder="Username"
            >
            <span id="usernameError" class="error-msg" style="display: none;">Username taken!</span>
            <br>
            <input
                class="inputs space-input"
                type="password"
                id="password" 
                placeholder="Password"
            >
            <br>
            <p id="empty" class="error-msg" style="display: none;"></p>
            <button id="loginButton" class="button">
                Login
            </button>
        </div>
          <script src="Main.js"></script>
    </body>
</html>
