<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ImesgU</title>
        <link rel="stylesheet" href="style.css">
        <script src="Main.js"></script>
    </head>

    <body>
        <h1 class=" loginpage">ImesgU</h1>
        <div class="login-box">
            <h2>Login</h2>
            <input
                class="inputs space-input"
                type="text"
                id="username"
                placeholder="Username"
            >
            <br>
            <input
                class="inputs space-input"
                type="password"
                id="password"
                placeholder="Password"
            >
            <br>
            <button id="loginButton" class="button">
                <a href="Chatlog.html" class="button ">Login</a>
            </button>
            <p id="message"></p>
        </div>
        <script src="Main.js"></script>
    </body>
</html>
