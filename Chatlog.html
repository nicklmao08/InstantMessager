<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ChatLog</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="screen">
                <div class="sidebar">

                    <div class="logo">
                        <h2><span class="logo-img"><img src="Images/ImesgU.png" alt="Logo" class="logo-img"> </span></h2>
                        <h3>Contacts</h3>
                        <div id="onlineUsers"></div>
                    
                       <div class="add-contact">

                            <input
                                type="text"
                                id="contactUsername"
                                placeholder="Enter username"
                            >

                            <button
                                onclick="addContact()"
                                class="add-button"
                            >
                            <img
                                src="Images/add.png"
                                class="add-icon"
                                alt="Add"
                            >
                            </button>

                        </div>

                        <p id="contactError"></p>

                        <div id="contacts"></div>

                    </div>
                    <button onclick="showGroupForm()">
                        + Create Group
                    </button>

                    <div id="groupForm" style="display: none;">

                        <input
                            type="text"
                            id="groupName"
                            placeholder="Group name"
                        >

                        <div id="groupContacts"></div>

                        <p id="groupError"></p>

                        <button onclick="createGroup()">
                            Create
                        </button>

                    </div>
                    <div id="conversationList"></div>


                    </div>
    

            <div class="chat">

                <div class="chathead chatborder">

                <img src="Images/user.png" class="contactIcon">

                <h3 id="contactName">
                    Select a contact
                </h3>

                <button
                    class="logout-button"
                    onclick="logout()"
                >
                Log out
                </button>

            </div>
 

                <div id="messages" class="messages">

                </div>


                <div class="message-input">

                <input
                    type="text"
                    id="messageInput"
                    class="type"
                    placeholder="Type a message..."
                >

                <button
                    id="send-button"
                    class="send-button"
                    onclick="sendMessage()"
                >
                    <img
                        src="Images/send.png"
                        class="send-icon"
                        alt="Send"
                    >
                </button>

        </div>

    </div>

</div>


<script src="chat.js"></script>

</body>

</html>
