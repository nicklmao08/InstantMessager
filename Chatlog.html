<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ChatLog</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add_2" />
        <link rel="stylesheet" href="style.css">
        <script src="Main.js"></script>
    </head>
    <body>
        <div class="screen">
                <div class="sidebar">

                    <div class="logo">
                        <h2><span class="logo-img"><img src="Images/ImesgU.png" alt="Logo" class="logo-img"> </span></h2>
                    </div>
                
                
                       <div class="contact"
                            onclick="openChat('Mom')">
                            <img src="Images/user.png" class="contactIcon">
                            <span>Mom</span>
                       </div>
                       <div class="contact"
                            onclick="openChat('Dad')">
                            <img src="Images/user.png" class="contactIcon">
                            <span>Dad</span>
                       </div>
                </div>

        

            <div class="chat">

                <div class="chathead">
                    <img src="Images/user.png" class="contactIcon">
                    <h3 id="contactName">Select a contact</h3>
                </div>


                <div id="messages" class="messages">

                </div>


                <div class="message-input">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                >

                <button onclick="sendMessage()">
                    Send
                </button>

                </div>

            </div>
        </div>

</div> 
    </body>
   
</html>
